<main>

<h3>Please fill out the form below to make a reservation!</h3>
<form id="reservationForm">

	
	<p><label>Name: <input type="text" id="name"></label></p>
	<p><label>Email: <input type="email" id="email"></label></p>
	<p><label>Party size: <input type="number" id="party"></label></p>
	<p><input type="radio" name="seating" value="inside"> Seating Inside</p>
	<p><input type="radio" name="seating" value="outside"> Seating Outside</p>
	<p><label>Dietary Restrictions: <input type="text" id="notes"></label></p>
	<p><input type="checkbox" name="newsletter" value="yes"> Sign up for our newsletter?</p>
	
	<p>	
		<label for="date">Date:</label> 
		<input type="date" id="date" required>
		<label for="time">Time:</label>
		<input type="time" id="time" required>
	</p>

	<p>
		<input type="submit" class="submit" value="Confirm my reservation!">
		<input type="reset" class="reset" value="Reset">
	</p>
	</p>


</form>
